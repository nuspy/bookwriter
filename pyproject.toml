[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookwriter"
version = "0.1.0"
description = "Trasforma frammenti sparsi (o interi libri) in un libro/archivio con LLM locale (LM Studio)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "atain" }]
dependencies = [
    # CLI e config
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlmodel>=0.0.16",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
    # Memoria e organizzazione (import al livello della CLI)
    "lancedb>=0.9",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    # Composizione ed export. Una sola catena per tutti i formati: il compositore di
    # bookwriter.forge impagina PDF, DOCX ed EPUB dallo stesso modello di libro.
    "reportlab>=4.0",      # impaginazione PDF
    "python-docx>=1.1",    # DOCX con stili, indice vivo e titoli correnti
    "pillow>=10.0",        # copertine
    "pyyaml>=6.0",         # book.yaml
    "pyphen>=0.14",        # sillabazione: senza, il giustificato apre fiumi di bianco
    "pymupdf>=1.24",       # controlli di stampa e lettura dei PDF importati
    # Ricerca sul web (fase 3) e lettura delle pagine trovate.
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Loader per formati aggiuntivi; importati in modo lazy.
ingest = ["ebooklib>=0.18"]
# Interfaccia grafica desktop.
gui = ["pyside6>=6.6"]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "ruff>=0.4"]
# Installazione completa (runtime): loader + GUI.
all = ["ebooklib>=0.18", "pyside6>=6.6"]

[project.scripts]
bookwriter = "bookwriter.cli:app"

[tool.setuptools.packages.find]
include = ["bookwriter*"]

[tool.setuptools.package-data]
# I cataloghi di traduzione dell'interfaccia viaggiano col pacchetto.
"bookwriter.gui" = ["locales/*.json"]
# Il metodo, i suoi riferimenti e i modelli di documento: li legge l'assistente durante le
# sette fasi, quindi devono stare accanto al codice e non nel repository di partenza.
"bookwriter.forge" = ["assets/*.md", "assets/templates/*", "assets/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Il compositore è codice di terze parti incorporato così com'è (vedi bookwriter/forge/bookgen):
# riformattarlo renderebbe impossibile riallinearlo alla sorgente quando cambia.
exclude = ["bookwriter/forge/bookgen"]
