[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookwriter"
version = "0.1.0"
description = "Trasforma frammenti sparsi (o interi libri) in un libro/archivio con LLM locale (LM Studio)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "atain" }]
dependencies = [
    # CLI e config
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlmodel>=0.0.16",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
    # Memoria e organizzazione (import al livello della CLI)
    "lancedb>=0.9",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    # Export (formati di default docx/pdf)
    "pypandoc-binary>=1.13",
    "reportlab>=4.0",
]

[project.optional-dependencies]
# Loader per formati aggiuntivi (pdf/docx/epub); importati in modo lazy.
ingest = ["pymupdf>=1.24", "python-docx>=1.1", "ebooklib>=0.18", "beautifulsoup4>=4.12"]
# Interfaccia grafica desktop.
gui = ["pyside6>=6.6"]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "ruff>=0.4"]
# Installazione completa (runtime): loader + GUI.
all = [
    "pymupdf>=1.24", "python-docx>=1.1", "ebooklib>=0.18", "beautifulsoup4>=4.12",
    "pyside6>=6.6",
]

[project.scripts]
bookwriter = "bookwriter.cli:app"

[tool.setuptools.packages.find]
include = ["bookwriter*"]

[tool.setuptools.package-data]
# I cataloghi di traduzione dell'interfaccia viaggiano col pacchetto.
"bookwriter.gui" = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
